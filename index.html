<html lang="en-us">
<head>
    <title>jtara1.github.io</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        table {
            width: 550px;
            border-collapse: collapse;
            margin: 20px;
            box-sizing: border-box;
        }
        th, td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
        }

        @media (max-width: 600px) {
            table {
                width: calc(100dvw - 40px);
            }
        }
    </style>

    <script>
      // Function to check status of each site
      function redirect() {
        window.location.href = "https://elk.gg";
      }

      // Run the function once the page content is fully loaded
      document.addEventListener('DOMContentLoaded', redirect);
    </script>
</head>
<body>
  <p>redirecting to https://elk.gg ...</p>
</body>
</html>
